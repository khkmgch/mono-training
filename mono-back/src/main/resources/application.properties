quarkus.datasource.db-kind=postgresql

# Scoped to %dev so %test leaves connection info unset and Dev Services starts an
# ephemeral Postgres instead of reusing the dev database.
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/mono_db
%dev.quarkus.datasource.username=mono_user
%dev.quarkus.datasource.password=mono_pass

# Pinned to match the docker-compose Postgres image.
quarkus.datasource.devservices.image-name=postgres:18

quarkus.flyway.migrate-at-start=true
quarkus.flyway.default-schema=public

# Resolve unqualified @Table(name="users") to app.users.
quarkus.hibernate-orm.database.default-schema=app
# Flyway owns the schema; Hibernate only validates against it, never generates DDL.
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.hibernate-orm.jdbc.timezone=UTC

%dev.quarkus.hibernate-orm.log.sql=true
